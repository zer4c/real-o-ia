<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101614" />
    <meta name="description" content="Compara una red convolucional y k-means para analizar imágenes con el prototipo académico Real o IA." />
    <title>Análisis de imagen</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var theme = localStorage.getItem('real-o-ia-theme');
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
